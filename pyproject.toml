[project]
name = "autojoinquant"
version = "0.1.8"
description = "Multi-account cross-platform JoinQuant daily check-in automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.scripts]
autojoinquant = "autojoinquant.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/autojoinquant" = ["checkin.mjs", "captcha_solver.py"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
# Development commands use source directly; install the CLI with uv tool install .
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
