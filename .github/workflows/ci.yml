name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: node --check checkin.mjs
      - run: uv build
      - run: uv run autojoinquant --help

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v20
      - run: nix flake check --print-build-logs
